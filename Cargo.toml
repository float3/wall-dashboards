[package]
name = "wall-dashboards"
version = "0.2.0"
edition = "2021"
description = "Air quality, weather and departure panels for a wall display"
homepage = "https://github.com/float3/wall-dashboards"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# The air sensor is plain HTTP on the LAN; only the weather and departure
# feeds are HTTPS, so TLS comes in with those panels alone.
ureq = { version = "3", default-features = false }

# One feature per panel, so a build can leave out what a host never shows.
[features]
default = ["air", "weather", "transit"]
air = []
weather = ["https"]
transit = ["https"]
https = ["ureq/rustls", "ureq/gzip"]

[profile.release]
lto = true
strip = true
